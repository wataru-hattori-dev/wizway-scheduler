version = 0.1

[default.global.parameters]
stack_name = "wizway-scheduler"
region = "ap-northeast-1"
profile = "deploy"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
fail_on_empty_changeset = false
resolve_s3 = true
# Secrets and CorsOrigins are passed at deploy time (not stored in git).
parameter_overrides = "DynamoDBTableName=\"wizway-scheduler\" AllowDevReseed=\"false\" AllowDevAuth=\"false\" EnableApiDocs=\"false\" SlackTestMode=\"true\" SlackDryRun=\"false\" SlackDestinationLabels=\"true\""
